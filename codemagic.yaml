workflows:
  android-build:
    name: Build Android APK

    environment:
      java: 21

    scripts:
      - name: Make gradlew executable
        script: |
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
